<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Title Badge & Header -->
  <rect x="40" y="20" width="200" height="28" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
  <text x="140" y="38" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle" letter-spacing="0.5">C2 • CONTAINER LEVEL</text>
  <text x="40" y="72" font-size="24" font-weight="800" fill="#0f172a">FlowForge DWOP — Decoupled Container Architecture</text>

  <!-- Platform System Boundary (Large Outline) -->
  <rect x="40" y="95" width="820" height="615" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <rect x="42" y="97" width="816" height="34" rx="12" fill="#f8fafc" />
  <text x="60" y="119" font-size="13" font-weight="800" fill="#1e40af">Distributed Workflow Orchestration Platform [FlowForge Boundary]</text>

  <!-- 1. Presentation Tier: Web Console -->
  <g transform="translate(70, 145)">
    <rect x="0" y="0" width="760" height="105" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="16" y="14" width="36" height="36" rx="8" fill="#f0f9ff" />
    <text x="34" y="38" font-size="18" text-anchor="middle">🖥️</text>
    <text x="64" y="30" font-size="15" font-weight="700" fill="#0f172a">Web Console Container</text>
    <text x="64" y="48" font-size="12" font-weight="600" fill="#0284c7">React 18 + Vite SPA · Tailwind CSS · High-Tech Dark/Light Theme</text>
    <text x="16" y="75" font-size="11.5" fill="#475569">Interactive visual DAG pipeline designer, real-time step progress stepper, telemetry dashboard, worker queue monitor, and RBAC client guards.</text>
    <text x="16" y="94" font-size="10.5" font-weight="600" fill="#0284c7">Source: src/frontend/ (27/27 Vitest passed)</text>
  </g>

  <!-- Connection: Web -> Backend -->
  <path d="M 450 250 L 450 285" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="455" y="256" width="160" height="20" rx="4" fill="#f1f5f9" />
  <text x="535" y="270" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">REST / JSON / Bearer Token</text>

  <!-- 2. Application Core: FastAPI Orchestrator Master -->
  <g transform="translate(70, 290)">
    <rect x="0" y="0" width="760" height="125" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.2" filter="url(#shadow)" />
    <rect x="16" y="14" width="36" height="36" rx="8" fill="#eff6ff" />
    <text x="34" y="38" font-size="18" text-anchor="middle">⚡</text>
    <text x="64" y="30" font-size="15" font-weight="700" fill="#0f172a">FastAPI Orchestrator Master Container</text>
    <text x="64" y="48" font-size="12" font-weight="600" fill="#2563eb">Python 3.10+ ASGI Engine · Uvicorn · Pydantic v2 Invariant Validation</text>
    <text x="16" y="75" font-size="11.5" fill="#475569">Trust Boundary: HMAC-SHA256 authentication, Kahn DAG cycle detection (O(V+E)), atomic execution state machine with SKIPPED branch cascade, and 5-queue task dispatching.</text>
    <text x="16" y="94" font-size="10.5" font-weight="600" fill="#2563eb">Source: src/backend/app/ (31/31 Pytest passed, 16 REST Paths, 24 Operations)</text>
  </g>

  <!-- Connections from FastAPI to Workers and DB -->
  <path d="M 260 415 L 260 455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="180" y="425" width="160" height="20" rx="4" fill="#f1f5f9" />
  <text x="260" y="439" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">45s Heartbeat / Task Poll</text>

  <path d="M 640 415 L 640 455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="570" y="425" width="140" height="20" rx="4" fill="#f1f5f9" />
  <text x="640" y="439" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">SQL / ACID Connection</text>

  <!-- 3. Bottom Left: Distributed Worker Fleet -->
  <g transform="translate(70, 460)">
    <rect x="0" y="0" width="365" height="225" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" filter="url(#shadow)" />
    <text x="16" y="26" font-size="14" font-weight="700" fill="#0d9488">Distributed Worker Fleet</text>
    <text x="16" y="44" font-size="11" font-weight="600" fill="#0f172a">Multi-Process Compute Daemons</text>
    <text x="16" y="66" font-size="11" fill="#475569">Autonomous worker nodes executing tasks asynchronously across 5 dedicated queue lanes:</text>
    <g transform="translate(16, 80)">
      <rect x="0" y="0" width="155" height="24" rx="4" fill="#f0fdfa" stroke="#99f6e4" />
      <text x="8" y="16" font-size="10.5" font-weight="600" fill="#0f766e">⚡ default (Webhooks)</text>

      <rect x="165" y="0" width="155" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="173" y="16" font-size="10.5" font-weight="600" fill="#1e40af">🧮 compute (CPU intensive)</text>

      <rect x="0" y="32" width="155" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="8" y="48" font-size="10.5" font-weight="600" fill="#334155">💾 data-io (Storage / DB)</text>

      <rect x="165" y="32" width="155" height="24" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="173" y="48" font-size="10.5" font-weight="600" fill="#92400e">💳 payment (Saga orders)</text>

      <rect x="0" y="64" width="320" height="24" rx="4" fill="#faf5ff" stroke="#e9d5ff" />
      <text x="8" y="80" font-size="10.5" font-weight="600" fill="#6b21a8">🤖 ai-agent (LLM inference &amp; reasoning)</text>
    </g>
    <text x="16" y="190" font-size="10.5" fill="#475569">• Atomic CAS task claiming prevents duplicate executions.</text>
    <text x="16" y="208" font-size="10.5" fill="#475569">• 45s TTL heartbeat sentinels detect crashed nodes.</text>
  </g>

  <!-- 4. Bottom Right: Relational Database Container -->
  <g transform="translate(465, 460)">
    <rect x="0" y="0" width="365" height="225" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <text x="16" y="26" font-size="14" font-weight="700" fill="#334155">Relational Database Container</text>
    <text x="16" y="44" font-size="11" font-weight="600" fill="#0f172a">Dual-Tier Persistence (SQLite / PostgreSQL)</text>
    <text x="16" y="66" font-size="11" fill="#475569">Normalized relational schema guaranteeing ACID transactions across 6 core entities:</text>
    <g transform="translate(16, 78)">
      <text x="0" y="15" font-size="11" fill="#0f172a">• <tspan font-weight="600">app_users:</tspan> PBKDF2 hash, 4 roles RBAC</text>
      <text x="0" y="34" font-size="11" fill="#0f172a">• <tspan font-weight="600">workflow_definitions:</tspan> Versioned JSON DAG schemas</text>
      <text x="0" y="53" font-size="11" fill="#0f172a">• <tspan font-weight="600">workflow_instances:</tspan> Execution state &amp; contexts</text>
      <text x="0" y="72" font-size="11" fill="#0f172a">• <tspan font-weight="600">task_executions:</tspan> Step status, retries, assigned worker</text>
      <text x="0" y="91" font-size="11" fill="#0f172a">• <tspan font-weight="600">worker_nodes:</tspan> Hostname, heartbeat &amp; concurrency</text>
      <text x="0" y="110" font-size="11" fill="#0f172a">• <tspan font-weight="600">audit_logs:</tspan> Append-only SOC-2 compliance records</text>
    </g>
    <text x="16" y="208" font-size="10.5" font-weight="600" fill="#2563eb">Enforces foreign key cascades and zero payload corruption.</text>
  </g>

  <!-- External Services (Right Side Column) -->
  <g transform="translate(890, 95)">
    <rect x="0" y="0" width="270" height="615" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="20" y="30" font-size="13" font-weight="800" fill="#475569">External Services &amp; Cloud</text>

    <!-- External 1: AI Gateway -->
    <rect x="15" y="50" width="240" height="155" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)" />
    <text x="28" y="74" font-size="13" font-weight="700" fill="#7c3aed">9Router AI / LLM Gateway</text>
    <text x="28" y="92" font-size="11" font-weight="600" fill="#0f172a">GPT-4o / DeepSeek Heuristics</text>
    <text x="28" y="114" font-size="10.5" fill="#475569">Decomposes natural language prompts into DAGs with strict 0-cycle validation.</text>
    <text x="28" y="146" font-size="10.5" fill="#475569">Parses execution crash stacktraces for automated self-healing recommendations.</text>
    <text x="28" y="190" font-size="10" font-weight="600" fill="#7c3aed">OpenAI-Compatible Chat API</text>

    <!-- External 2: Slack / PagerDuty -->
    <rect x="15" y="225" width="240" height="125" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)" />
    <text x="28" y="249" font-size="13" font-weight="700" fill="#ea580c">Slack &amp; Incident Alerts</text>
    <text x="28" y="267" font-size="11" font-weight="600" fill="#0f172a">External Webhook Integrations</text>
    <text x="28" y="289" font-size="10.5" fill="#475569">Immediate P1 escalation alerts for pipeline errors with idempotency protection.</text>
    <text x="28" y="335" font-size="10" font-weight="600" fill="#ea580c">HTTPS POST Webhook Delivery</text>

    <!-- External 3: Data Warehouse -->
    <rect x="15" y="370" width="240" height="130" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" filter="url(#shadow)" />
    <text x="28" y="394" font-size="13" font-weight="700" fill="#0f766e">Enterprise Analytics Lake</text>
    <text x="28" y="412" font-size="11" font-weight="600" fill="#0f172a">Parquet / Spark Warehouse</text>
    <text x="28" y="434" font-size="10.5" fill="#475569">Long-term analytical storage for data extraction and high-throughput transformations.</text>
    <text x="28" y="485" font-size="10" font-weight="600" fill="#0f766e">Distributed File &amp; DB Protocol</text>
  </g>

  <!-- Flow Line from Backend to AI Gateway -->
  <path d="M 830 330 L 905 180" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>