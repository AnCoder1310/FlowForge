<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="crow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 8 5 L 0 10 M 8 0 L 8 10" fill="none" stroke="#2563eb" stroke-width="1.5" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Title Badge & Header -->
  <rect x="40" y="20" width="220" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="150" y="38" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">RELATIONAL DATA MODEL</text>
  <text x="40" y="72" font-size="24" font-weight="800" fill="#0f172a">Entity Relationship Diagram (ERD) — 6 Normalized Tables</text>

  <!-- ROW 1 -->
  <!-- Table 1: app_users -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="340" height="260" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 0 L 340 0 L 340 38 L 0 38 Z" fill="#eff6ff" />
    <text x="16" y="25" font-size="14" font-weight="800" fill="#1e40af">app_users</text>
    <text x="324" y="25" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Auth &amp; RBAC</text>

    <g transform="translate(16, 56)" font-size="11.5">
      <text y="0" font-weight="700" fill="#d97706">PK <tspan font-weight="600" fill="#0f172a">id</tspan> <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="24" font-weight="700" fill="#2563eb">UK <tspan font-weight="600" fill="#0f172a">email</tspan> <tspan fill="#64748b">VARCHAR(255)</tspan></text>
      <text y="48" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;username <tspan fill="#64748b">VARCHAR(64)</tspan></text>
      <text y="72" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;password_hash <tspan fill="#64748b">VARCHAR(255) [PBKDF2]</tspan></text>
      <text y="96" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;full_name <tspan fill="#64748b">VARCHAR(128)</tspan></text>
      <text y="120" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;role <tspan fill="#64748b">VARCHAR(20) [4 Roles]</tspan></text>
      <text y="144" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;is_active <tspan fill="#64748b">BOOLEAN</tspan></text>
      <text y="168" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;created_at <tspan fill="#64748b">TIMESTAMP</tspan></text>
      <text y="192" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;last_login_at <tspan fill="#64748b">TIMESTAMP NULL</tspan></text>
    </g>
  </g>

  <!-- Table 2: workflow_definitions -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="340" height="260" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 0 L 340 0 L 340 38 L 0 38 Z" fill="#f0f9ff" />
    <text x="16" y="25" font-size="14" font-weight="800" fill="#0369a1">workflow_definitions</text>
    <text x="324" y="25" font-size="11" font-weight="600" fill="#0284c7" text-anchor="end">DAG Schemas</text>

    <g transform="translate(16, 56)" font-size="11.5">
      <text y="0" font-weight="700" fill="#d97706">PK <tspan font-weight="600" fill="#0f172a">id</tspan> <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="24" font-weight="700" fill="#2563eb">UK <tspan font-weight="600" fill="#0f172a">name</tspan> <tspan fill="#64748b">VARCHAR(128)</tspan></text>
      <text y="48" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;version <tspan fill="#64748b">INTEGER DEFAULT 1</tspan></text>
      <text y="72" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;description <tspan fill="#64748b">TEXT</tspan></text>
      <text y="96" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;dag_schema <tspan fill="#64748b">JSON [Kahn Validated]</tspan></text>
      <text y="120" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;is_active <tspan fill="#64748b">BOOLEAN</tspan></text>
      <text y="144" font-weight="700" fill="#7c3aed">FK <tspan font-weight="600" fill="#0f172a">created_by</tspan> <tspan fill="#64748b">INTEGER → users.id</tspan></text>
      <text y="168" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;created_at <tspan fill="#64748b">TIMESTAMP</tspan></text>
      <text y="192" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;updated_at <tspan fill="#64748b">TIMESTAMP</tspan></text>
    </g>
  </g>

  <!-- Table 3: audit_logs -->
  <g transform="translate(820, 100)">
    <rect x="0" y="0" width="340" height="260" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 0 L 340 0 L 340 38 L 0 38 Z" fill="#f8fafc" />
    <text x="16" y="25" font-size="14" font-weight="800" fill="#1e293b">audit_logs</text>
    <text x="324" y="25" font-size="11" font-weight="600" fill="#475569" text-anchor="end">SOC-2 Trail</text>

    <g transform="translate(16, 56)" font-size="11.5">
      <text y="0" font-weight="700" fill="#d97706">PK <tspan font-weight="600" fill="#0f172a">id</tspan> <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="24" font-weight="700" fill="#7c3aed">FK <tspan font-weight="600" fill="#0f172a">actor_user_id</tspan> <tspan fill="#64748b">INTEGER → users.id</tspan></text>
      <text y="48" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;action <tspan fill="#64748b">VARCHAR(32) [7 Actions]</tspan></text>
      <text y="72" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;module <tspan fill="#64748b">VARCHAR(64)</tspan></text>
      <text y="96" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;detail <tspan fill="#64748b">TEXT</tspan></text>
      <text y="120" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;ip_address <tspan fill="#64748b">VARCHAR(45)</tspan></text>
      <text y="144" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;created_at <tspan fill="#64748b">TIMESTAMP [Append-Only]</tspan></text>
    </g>
  </g>

  <!-- ROW 2 -->
  <!-- Table 4: worker_nodes -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="340" height="280" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 0 L 340 0 L 340 38 L 0 38 Z" fill="#f0fdfa" />
    <text x="16" y="25" font-size="14" font-weight="800" fill="#0f766e">worker_nodes</text>
    <text x="324" y="25" font-size="11" font-weight="600" fill="#0d9488" text-anchor="end">Worker Fleets</text>

    <g transform="translate(16, 56)" font-size="11.5">
      <text y="0" font-weight="700" fill="#d97706">PK <tspan font-weight="600" fill="#0f172a">worker_id</tspan> <tspan fill="#64748b">VARCHAR(64)</tspan></text>
      <text y="24" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;hostname <tspan fill="#64748b">VARCHAR(128)</tspan></text>
      <text y="48" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;status <tspan fill="#64748b">VARCHAR(16) [ONLINE/OFFLINE]</tspan></text>
      <text y="72" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;supported_queues <tspan fill="#64748b">JSON [5 Queues]</tspan></text>
      <text y="96" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;max_concurrency <tspan fill="#64748b">INTEGER [Slots]</tspan></text>
      <text y="120" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;current_load <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="144" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;last_heartbeat_at <tspan fill="#64748b">TIMESTAMP [45s TTL]</tspan></text>
      <text y="168" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;registered_at <tspan fill="#64748b">TIMESTAMP</tspan></text>
    </g>
  </g>

  <!-- Table 5: workflow_instances -->
  <g transform="translate(430, 420)">
    <rect x="0" y="0" width="340" height="280" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 0 L 340 0 L 340 38 L 0 38 Z" fill="#eff6ff" />
    <text x="16" y="25" font-size="14" font-weight="800" fill="#1e40af">workflow_instances</text>
    <text x="324" y="25" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">State Machine</text>

    <g transform="translate(16, 56)" font-size="11.5">
      <text y="0" font-weight="700" fill="#d97706">PK <tspan font-weight="600" fill="#0f172a">id</tspan> <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="24" font-weight="700" fill="#7c3aed">FK <tspan font-weight="600" fill="#0f172a">workflow_id</tspan> <tspan fill="#64748b">INTEGER → defs.id</tspan></text>
      <text y="48" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;workflow_name <tspan fill="#64748b">VARCHAR(128)</tspan></text>
      <text y="72" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;version <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="96" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;status <tspan fill="#64748b">VARCHAR(16) [6 States]</tspan></text>
      <text y="120" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;input_payload <tspan fill="#64748b">JSON</tspan></text>
      <text y="144" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;context_data <tspan fill="#64748b">JSON [Aggregator]</tspan></text>
      <text y="168" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;started_at <tspan fill="#64748b">TIMESTAMP</tspan></text>
      <text y="192" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;completed_at <tspan fill="#64748b">TIMESTAMP NULL</tspan></text>
      <text y="216" font-weight="700" fill="#7c3aed">FK <tspan font-weight="600" fill="#0f172a">triggered_by</tspan> <tspan fill="#64748b">INTEGER → users.id</tspan></text>
    </g>
  </g>

  <!-- Table 6: task_executions -->
  <g transform="translate(820, 420)">
    <rect x="0" y="0" width="340" height="280" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 0 L 340 0 L 340 38 L 0 38 Z" fill="#faf5ff" />
    <text x="16" y="25" font-size="14" font-weight="800" fill="#6b21a8">task_executions</text>
    <text x="324" y="25" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="end">Step Lifecycles</text>

    <g transform="translate(16, 56)" font-size="11.5">
      <text y="0" font-weight="700" fill="#d97706">PK <tspan font-weight="600" fill="#0f172a">id</tspan> <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="24" font-weight="700" fill="#7c3aed">FK <tspan font-weight="600" fill="#0f172a">instance_id</tspan> <tspan fill="#64748b">INTEGER → inst.id</tspan></text>
      <text y="48" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;step_id <tspan fill="#64748b">VARCHAR(64)</tspan></text>
      <text y="72" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;step_name <tspan fill="#64748b">VARCHAR(128)</tspan></text>
      <text y="96" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;queue_name <tspan fill="#64748b">VARCHAR(32) [5 Queues]</tspan></text>
      <text y="120" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;status <tspan fill="#64748b">VARCHAR(16) [SKIPPED/etc]</tspan></text>
      <text y="144" font-weight="700" fill="#7c3aed">FK <tspan font-weight="600" fill="#0f172a">assigned_worker_id</tspan> <tspan fill="#64748b">VARCHAR → workers</tspan></text>
      <text y="168" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;retry_count <tspan fill="#64748b">INTEGER / max_retries</tspan></text>
      <text y="192" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;timeout_seconds <tspan fill="#64748b">INTEGER</tspan></text>
      <text y="216" font-weight="600" fill="#0f172a">&nbsp;&nbsp;&nbsp;&nbsp;started_at / completed_at <tspan fill="#64748b">TIMESTAMP</tspan></text>
    </g>
  </g>

  <!-- Connectors (1:N Foreign Key relations) -->
  <!-- app_users -> workflow_definitions -->
  <path d="M 380 180 L 430 180" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#crow)" />

  <!-- workflow_definitions -> workflow_instances -->
  <path d="M 600 360 L 600 420" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#crow)" />

  <!-- workflow_instances -> task_executions -->
  <path d="M 770 540 L 820 540" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#crow)" />

  <!-- worker_nodes -> task_executions -->
  <path d="M 380 620 L 820 620" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#crow)" />

  <!-- app_users -> audit_logs -->
  <path d="M 380 140 L 400 140 L 400 80 L 840 80 L 840 100" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#crow)" />
</svg>