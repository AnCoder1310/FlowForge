          phone: '+84901111222'
          avatarUrl: https://assets.example.test/avatars/owner.png
          timezone: Asia/Ho_Chi_Minh
          role: SHOP_OWNER
          isActive: true
          lastLoginAt: '2026-09-17T09:00:00Z'
