components:
  schemas:
    AiDiagnoseFailureRequest:
      properties:
        instanceId:
          type: integer
          title: Instanceid
        taskId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Taskid
      type: object
      required:
      - instanceId
      title: AiDiagnoseFailureRequest
    AiDiagnoseFailureResponse:
      properties:
        rootCause:
          type: string
          title: Rootcause
        suggestedFix:
          type: string
          title: Suggestedfix
        severity:
          type: string
          title: Severity
        autoFixable:
          type: boolean
          title: Autofixable
      type: object
      required:
      - rootCause
      - suggestedFix
      - severity
      - autoFixable
      title: AiDiagnoseFailureResponse
    AiGenerateWorkflowRequest:
      properties:
        prompt:
          type: string
          title: Prompt
      type: object
      required:
      - prompt
      title: AiGenerateWorkflowRequest
    AiGenerateWorkflowResponse:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        dag:
          $ref: '#/components/schemas/DagDefinition'
        reasoning:
          type: string
          title: Reasoning
      type: object
      required:
      - name
      - description
      - dag
