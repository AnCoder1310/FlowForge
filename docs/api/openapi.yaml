      properties:
        currencyCode: {type: string, enum: [USD]}
        totalIncome: {type: number, format: decimal}
        totalExpense: {type: number, format: decimal}
        netResult: {type: number, format: decimal}
        transactionCount: {type: integer, minimum: 0}
        cashflow:
          type: array
          items: {$ref: '#/components/schemas/ReportPoint'}
        incomeByCategory:
          type: array
          items: {$ref: '#/components/schemas/CategoryAmount'}
        recentTransactions:
          type: array
          items: {$ref: '#/components/schemas/TransactionSummary'}
    ReportResponse:
      type: object
      required: [currencyCode, totalIncome, totalExpense, netResult, points]
      properties:
        currencyCode: {type: string, enum: [USD]}
        totalIncome: {type: number, format: decimal}
        totalExpense: {type: number, format: decimal}
        netResult: {type: number, format: decimal}
        points:
          type: array
          items: {$ref: '#/components/schemas/ReportPoint'}
    ReportPoint:
      type: object
      required: [key, income, expense, netResult]
      properties:
        key:
          type: string
          description: Aggregation bucket such as a month (`YYYY-MM`), a calendar day, or a category name.
        income: {type: number, format: decimal}
        expense: {type: number, format: decimal}
        netResult: {type: number, format: decimal}
    CategoryAmount:
      type: object
      required: [categoryId, categoryName, amount]
      properties:
        categoryId: {type: integer, format: int64}
        categoryName: {type: string}
        amount: {type: number, format: decimal}
    TransactionSummary:
      type: object
      required: [id, type, date, description, amount, currencyCode]
      properties:
        id: {type: integer, format: int64}
        type: {type: string, enum: [INCOME, EXPENSE]}
        date: {type: string, format: date}
        description: {type: string}
        amount: {type: number, format: decimal}
        currencyCode: {type: string, enum: [USD]}

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        totalItems: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    PagedIncomeResponse:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Income'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    PagedExpenseResponse:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Expense'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    PagedImportResponse:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ImportBatch'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    PagedAuditResponse:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    PagedUserResponse:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        meta: {$ref: '#/components/schemas/PageMeta'}

    ProblemDetails:
      type: object
      required: [type, title, status, errorCode]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        errorCode:
          type: string
          description: Stable machine-readable application error code.
          example: RESOURCE_NOT_FOUND
        detail: {type: string, nullable: true}
        instance: {type: string, format: uri-reference, nullable: true}
        traceId: {type: string, nullable: true}
    ValidationProblemDetails:
      allOf:
        - {$ref: '#/components/schemas/ProblemDetails'}
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: {type: string}
