  schemas:
    UserRole:
      type: string
      description: Application role used for authorization.
      enum: [ADMIN, SHOP_OWNER, EMPLOYEE, VIEWER]
    RecordStatus:
      type: string
      description: Lifecycle status of an income or expense record.
      enum: [DRAFT, PENDING, COMPLETED]
    DataSource:
      type: string
      description: How the record was created.
      enum: [MANUAL, EXCEL_IMPORT]
    SaleRegion:
      type: string
      nullable: true
      description: Sale region for an income record, when known.
      enum: [IN_EU, OUTSIDE_EU]
    SalesChannel:
      type: string
      nullable: true
      description: Channel through which the income was received, when known.
      enum: [ETSY_STORE, WEBSITE_DIRECT, INSTAGRAM_SHOP, LOCAL_MARKET, B2B_WHOLESALE]
    OriginScope:
      type: string
      description: Whether an expense originated domestically or internationally.
      enum: [DOMESTIC, INTERNATIONAL]
    PaymentMethod:
      type: string
      nullable: true
      description: How an expense was paid, when known.
      enum: [CREDIT_CARD, BANK_TRANSFER, CASH, PAYPAL]
    ImportType:
      type: string
      description: Whether an Excel import contains income or expense rows.
      enum: [INCOME, EXPENSE]
    ImportStatus:
      type: string
      description: Processing status of an import batch.
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]
    AuditAction:
      type: string
      description: Business audit action. Persistence maps lower-level SQL trigger events to this taxonomy.
      enum: [CREATE, UPDATE, SOFT_DELETE, RESTORE, LOGIN, EXPORT, IMPORT]

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, format: password, minLength: 1, maxLength: 128}
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          readOnly: true
          description: Short-lived JWT access token. V1 does not return a refresh token.
        tokenType: {type: string, enum: [Bearer], readOnly: true}
        expiresAt: {type: string, format: date-time, readOnly: true}
        user: {$ref: '#/components/schemas/User'}
    User:
