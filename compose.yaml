services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_orchestrator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - workflow_orchestrator_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_orchestrator"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  workflow_orchestrator_postgres:
